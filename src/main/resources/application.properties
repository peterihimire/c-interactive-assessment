spring.application.name=assessment

# ==========================
# Active Profile
# ==========================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================
# Database
# ==========================
# No credential defaults in the base configuration.
# Production must provide these through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000

# ==========================
# Server
# ==========================
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

api.prefix=${API_PREFIX:/api/v1}

# ==========================
# Error Handling
# ==========================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ==========================
# JPA / Flyway
# ==========================
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==========================
# Logging
# ==========================
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:INFO}
logging.level.com.crowninteractive.assessment=INFO