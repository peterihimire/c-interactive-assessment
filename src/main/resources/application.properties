spring.application.name=assessment

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assessment_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ==========================
# Server
# ==========================
server.port=${SERVER_PORT:8080}
api.prefix=${API_PREFIX:/api/v1}

# ==========================
# Logging
# ==========================
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:INFO}
logging.level.org.springframework.boot.autoconfigure.flyway=${FLYWAY_LOG_LEVEL:INFO}
logging.level.com.benkih.estore=INFO


